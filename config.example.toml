# x-voice configuration for the terminal (`python -m xvoice --console`).
# The desktop app does not use this file. It saves settings in
# %APPDATA%\x-voice\config.toml from the settings window.
#
# Copy this file to config.toml only when you run from a checkout.
#
# Change the bot id and the wake phrase here when you use the terminal.

# Id of the dedicated voice-only bot.
# In Grok Bot: click the bot's name, choose Share, then Copy link.
# Paste only the last part of that link, after the final slash.
# Leave the quotes in place. x-voice refuses to start while this is still
# the placeholder below.
bot_id = "PASTE_BOT_ID_HERE"

# Which wake phrase to listen for.
# The desktop app starts on computer ("Computer" or "hey computer").
# That model is included with the app. The names below need the one-time
# model setup before a checkout can hear them.
#   hey_jarvis   ("hey jarvis")
#   alexa
#   hey_mycroft
#   hey_rhasspy
#   timer
#   weather
wake_model = "hey_jarvis"

# How sure the detector must be, from just above 0 up to 1.
# 0.5 is the usual starting point. Raise it (try 0.65, then 0.8) if a
# television, video, or other speech starts the call by mistake.
# Lower it (try 0.35) if saying the phrase does nothing.
threshold = 0.5

# Seconds to wait after a trigger before another one can start a call.
# The same wait is used after a failed attempt, and after a call ends.
# While a voice call is visible on screen, listening stays paused until
# that call goes away, and this wait is applied again afterwards.
# Raise it if a noisy room starts the call more than once.
cooldown_seconds = 10

# Microphone. Leave this empty to use the Windows default.
# A number picks a device by the index from: python -m xvoice --list-mics
# Text picks a device whose name contains that text, for example "Realtek".
mic_device = ""

# Play a short beep on this PC when a wake phrase is accepted.
# The beep is generated by Windows. No sound file is written.
chime = false

# Show a system-tray icon. Closing the window then leaves x-voice running.
# The terminal session (`--console`) stays in the terminal either way.
tray = false

# Start x-voice when you sign in to Windows. Off by default.
# The desktop app writes this into your user startup entries. No admin needed.
start_with_windows = false
